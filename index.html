<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget System - Giobi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .credits {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 2rem;
        }

        .credits a {
            color: white;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.5);
            transition: border-color 0.3s;
        }

        .credits a:hover {
            border-bottom-color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>budget.giobi.com</h1>
        <div class="credits">
            credits <a href="https://giobi.com">giobi.com</a> + Anacleto
        </div>
    </div>
</body>
</html>
